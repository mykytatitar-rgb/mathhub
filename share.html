<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Урок — Вектор</title>
<meta name="theme-color" content="#4B3FDB">
<meta name="robots" content="noindex,nofollow">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#F6F5FB;
    font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#17163A}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:420px;text-align:center}
  .box h1{font-size:19px;margin:0 0 10px}
  .box p{font-size:14px;line-height:1.65;color:#3D3B63;margin:0}
  .spin{width:34px;height:34px;margin:0 auto 16px;border:3px solid #E7E5F2;
    border-top-color:#4B3FDB;border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}

  /* ---- Портал учня ---- */
  #portal{display:none;min-height:100%;padding:0 0 40px}
  .pw{max-width:760px;margin:0 auto;padding:0 18px}
  .phead{background:linear-gradient(140deg,#4B3FDB,#2E248F);color:#fff;padding:26px 0 30px;margin-bottom:-14px}
  .phead h1{margin:0;font-size:22px;letter-spacing:-.3px}
  .phead .sub{margin-top:5px;font-size:13.5px;opacity:.85}
  .pcard{background:#fff;border:1px solid #E7E5F2;border-radius:16px;padding:18px 20px;margin-bottom:14px;
    box-shadow:0 6px 20px rgba(23,22,58,.05)}
  .pcard h2{margin:0 0 3px;font-size:15px}
  .pcard .h-sub{font-size:12.5px;color:#7C7A9C;margin-bottom:12px}
  .les{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-top:1px solid #F1F0F8}
  .les:first-of-type{border-top:0}
  .les__d{flex:0 0 auto;width:46px;text-align:center}
  .les__d b{display:block;font-size:17px;line-height:1}
  .les__d span{font-size:10px;text-transform:uppercase;font-weight:700;color:#7C7A9C}
  .les__m{flex:1;min-width:0}
  .les__t{font-weight:650;font-size:14px}
  .les__s{font-size:12.5px;color:#3D3B63;margin-top:2px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;
    letter-spacing:.4px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .tag--done{background:#E4F6EE;color:#0C7F51}
  .tag--miss{background:#FCEAEB;color:#C0323C}
  .tag--soon{background:#EDEBFE;color:#3A31B0}
  .mat{padding:12px 0;border-top:1px solid #F1F0F8}
  .mat:first-of-type{border-top:0}
  .mat__t{font-weight:650;font-size:14px}
  .mat__n{font-size:12.5px;color:#3D3B63;margin-top:3px;white-space:pre-wrap}
  .mat a{display:inline-flex;align-items:center;gap:6px;margin:7px 8px 0 0;padding:6px 12px;
    border:1px solid #E7E5F2;border-radius:9px;font-size:12.5px;font-weight:650;
    color:#3A31B0;text-decoration:none;background:#F7F6FE}
  .mat a:hover{border-color:#4B3FDB}
  .mat__soon{margin-top:7px;font-size:12.5px;color:#AAA8C2;font-style:italic}
  .les__go{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 14px;
    border-radius:9px;background:#4B3FDB;color:#fff;text-decoration:none;
    font-size:12.5px;font-weight:700}
  .les__go:hover{background:#3A31B0}
  .les__go::before{content:'▸';font-size:14px;line-height:1}

  /* Повернення з уроку до розкладу — поверх дошки, у безпечній зоні */
  .back-portal{position:fixed;left:14px;top:14px;z-index:10;
    padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;
    background:rgba(255,255,255,.94);color:#3A31B0;text-decoration:none;
    box-shadow:0 3px 14px rgba(23,22,58,.18)}
  .back-portal:hover{background:#fff}
  @media (max-width:700px){.back-portal{left:auto;right:14px;top:auto;bottom:14px}}
  .none{font-size:13px;color:#7C7A9C;padding:6px 0}
  .pin{max-width:320px;margin:0 auto;text-align:center}
  .pin input{width:100%;margin-top:14px;padding:13px 16px;font:inherit;font-size:19px;
    text-align:center;letter-spacing:4px;border:2px solid #E7E5F2;border-radius:12px;background:#fff}
  .pin input:focus{outline:0;border-color:#4B3FDB}
  .pin button{width:100%;margin-top:10px;padding:13px;font:inherit;font-size:14px;font-weight:700;
    border:0;border-radius:12px;background:#4B3FDB;color:#fff;cursor:pointer}
  .pin button:disabled{opacity:.5;cursor:default}
  .pin .err{margin-top:10px;font-size:13px;color:#C0323C;min-height:18px}
  .foot{text-align:center;font-size:11.5px;color:#AAA8C2;margin-top:22px}

  /* Чи дійшло написане учнем. Досі про це не знав ніхто: штрихи лежали в
     пам'яті вкладки, і закрита вкладка забирала їх із собою мовчки. */
  .ink{position:fixed;right:14px;top:14px;z-index:11;display:none;
    padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;
    background:rgba(255,255,255,.95);color:#3D3B63;box-shadow:0 3px 14px rgba(23,22,58,.18)}
  .ink.is-on{display:block}
  .ink.is-ok{color:#0C7F51}
  .ink.is-wait{color:#8A5409;background:#FDF3E3}
  @media (max-width:700px){.ink{right:auto;left:14px;top:auto;bottom:14px}}
</style>
</head>
<body>

<!-- Урок показуємо в окремій рамці: сторінка уроку самодостатня й нічого
     не знає про цю обгортку, тому її код ізольований від цієї сторінки. -->
<iframe id="frame" title="Дошка уроку"></iframe>

<div class="msg" id="msg">
  <div class="box">
    <div class="spin" id="spin"></div>
    <h1 id="h">Відкриваю урок…</h1>
    <p id="p">Хвилинку, завантажуються слайди.</p>
  </div>
</div>

<!-- Портал учня: розклад і матеріали. Та сама сторінка, бо саме її
     й лише її пускає повз захист сайту. -->
<div id="portal"></div>

<!-- Стан написаного учнем: «надсилаю», «збережено», «немає зв'язку» -->
<div class="ink" id="ink"></div>

<script>
/* Навіщо ця сторінка взагалі потрібна.

   Урок лежить у сховищі Supabase готовою HTML-сторінкою. Але Supabase
   навмисно віддає будь-який HTML як звичайний текст — щоб їхнім сховищем
   не користувалися для розміщення підроблених сторінок. Тому браузер учня
   показував би вихідний код замість уроку.

   Обхід простий: ми забираємо ту сторінку як текст самі й показуємо її
   в рамці. Для учня це виглядає як звичайне відкриття посилання. */

(function () {
  'use strict';

  /* Адреса й публічний ключ вписані прямо тут, а не взяті з assets/js/cloudconfig.js.
     Причина: уся тека assets закрита доступом Cloudflare — там код програми,
     і відкривати її стороннім не можна. Виняток зроблено лише для цієї сторінки.

     Ключ безпечний: він призначений саме для браузера, а доступ до даних
     вирішують правила в базі. Ця сторінка не читає жодної таблиці — лише
     викликає функції, які самі перевіряють код уроку. */
  var API = 'https://kcxqienzhopnsqmykhqv.supabase.co';
  var KEY = 'sb_publishable_QnaXu7Prui_8orIhc7eWRA_82NAxUPc';

  var WATCH_MS = 2000;   // як часто питати «чи є нове»

  var msg  = document.getElementById('msg');
  var spin = document.getElementById('spin');
  var h    = document.getElementById('h');
  var p    = document.getElementById('p');

  function fail(title, text) {
    spin.style.display = 'none';
    h.textContent = title;
    p.textContent = text;
  }

  // Код — у частині адреси після #, щоб він не потрапляв у журнали сервера.
  var path = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();

  /* Портал і сторінка уроку живуть за однією адресою і різняться лише
     частиною після #. На такий перехід браузер сторінку не перезавантажує,
     тому клік по «Відкрити урок» зовні виглядав як «нічого не сталося»:
     адреса мінялася, а на екрані лишався портал. Перезавантажуємо самі —
     заразом починає працювати кнопка «Назад». */
  var bootHash = location.hash;
  window.addEventListener('hashchange', function () {
    if (location.hash !== bootHash) location.reload();
  });

  function rpc(name, body) {
    return fetch(API + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  /* ============================================================
     Портал учня
     ============================================================
     Позначка portal: спереду навмисно: без неї код порталу не відрізнити
     від коду уроку — обидва шістнадцяткові однакової довжини. */

  /* Куди повертатися з уроку. Учень заходить у нього з розкладу, і без
     цього єдиним шляхом назад лишалася б кнопка браузера. */
  var BACK_KEY = 'vektor.fromPortal';

  if (/^portal:/i.test(path)) {
    try { sessionStorage.setItem(BACK_KEY, location.hash); } catch (e) {}
    startPortal(path.replace(/^portal:/i, '').trim());
    return;
  }

  // важливий тут лише код уроку — 32 шістнадцяткові символи; що перед ним,
  // нас не обходить, це тека репетитора
  if (!path || !/^[^\s/]+\/[0-9a-f]{16,}$/i.test(path)) {
    fail('Посилання неповне', 'Схоже, адресу скопійовано не до кінця. Попросіть надіслати її ще раз.');
    return;
  }

  showBackToPortal();

  /** Кнопка «до розкладу» — лише якщо учень справді прийшов з порталу. */
  function showBackToPortal() {
    var back = '';
    try { back = sessionStorage.getItem(BACK_KEY) || ''; } catch (e) {}
    if (!back) return;

    var a = document.createElement('a');
    a.className = 'back-portal';
    a.href = back;
    a.textContent = '← Мій розклад';
    document.body.appendChild(a);
  }

  // код уроку — це <тека репетитора>/<код>, а самій базі потрібен лише код
  var token = path.split('/').pop();
  var frame = document.getElementById('frame');
  var shownRev = -1;
  var failures = 0;
  var gone = 0;         // скільки разів поспіль сервер сказав, що посилання немає

  /* Номер останньої дії, яку вже показали.

     Раніше урок оновлювався лише тоді, коли репетитор його перевидав, — а
     перевидання могло не дійти й ніхто цього не бачив. Тепер дрібні зміни
     приходять самі: читаємо журнал дій і передаємо їх у сторінку уроку. */
  var opsAt = 0;

  /* Де саме учень зараз дивиться. Сама сторінка уроку повідомляє це нам,
     а ми повертаємо назад після оновлення — інакше кожна зміна від репетитора
     викидала б учня на початок першого слайда. */
  var view = null;

  /* Показуємо урок. Замінюємо вміст лише коли він справді змінився,
     і вшиваємо збережене місце, щоб перемальовування було незамітним. */
  function show(html, rev) {
    if (rev === shownRev) return;
    shownRev = rev;

    if (view) {
      // вставляємо перед закриттям тіла, щоб сторінка прочитала це до першого малювання
      var inject = '<script>window.__VIEW=' + JSON.stringify(view) + ';<\/script>';
      var at = html.lastIndexOf('</body>');
      html = at > -1 ? html.slice(0, at) + inject + html.slice(at) : html + inject;
    }

    frame.srcdoc = html;
    frame.style.display = 'block';
    msg.style.display = 'none';
    var t = html.match(/<title>([^<]*)<\/title>/);
    if (t) document.title = t[1];
  }

  function load() {
    return rpc('share_read', { p_token: token })
      .then(function (res) {
        // 404 — функції ще немає в базі: репетитор не доналаштував.
        // Казати учневі «перевірте інтернет» у цьому разі — збивати з пантелику.
        if (res.status === 404) throw new Error('setup');
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (rows) {
        var row = rows && rows[0];
        if (!row || !row.data) throw new Error('revoked');
        failures = 0;
        show(row.data, row.rev);
      });
  }

  /* ============================================================
     Живий канал уроку — як у Miro
     ============================================================

     Постійне зʼєднання з Supabase Realtime: зміни репетитора приходять у
     ту ж мить, а написане учнем репетитор отримує без очікування.
     Опитування нижче лишається запасним шляхом і, поки канал живий, питає
     сервер рідко.

     Клієнт свій, на кілька десятків рядків: ця сторінка не може тягнути
     код із теки кабінету — та закрита доступом. */

  var WATCH_SLOW_MS = 12000;   // коли канал живий, опитування — лише страховка

  var live = (function () {
    var topic = 'realtime:vektor-' + token;
    var ws = null, open = false, joined = false, ref = 0, beat = null, wait = 1000, queue = [];

    function raw(event, payload, t) {
      if (!ws || !open) return false;
      try {
        ws.send(JSON.stringify({ topic: t || topic, event: event, payload: payload, ref: String(++ref) }));
        return true;
      } catch (e) { return false; }
    }

    function connect() {
      if (ws || !window.WebSocket) return;
      try {
        ws = new WebSocket(API.replace(/^http/, 'ws') + '/realtime/v1/websocket?apikey=' +
          encodeURIComponent(KEY) + '&vsn=1.0.0');
      } catch (e) { ws = null; return later(); }

      ws.onopen = function () {
        open = true;
        wait = 1000;
        raw('phx_join', { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } });
        beat = setInterval(function () { raw('heartbeat', {}, 'phoenix'); }, 25000);
      };
      ws.onmessage = function (m) {
        var msg;
        try { msg = JSON.parse(m.data); } catch (e) { return; }
        if (msg.topic !== topic) return;
        if (msg.event === 'phx_reply' && msg.payload && msg.payload.status === 'ok' && !joined) {
          joined = true;
          var q = queue; queue = [];
          q.forEach(function (x) { send(x[0], x[1]); });
          return;
        }
        if (msg.event !== 'broadcast' || !msg.payload) return;
        var ev = msg.payload.event, data = msg.payload.payload || {};

        // жива дошка сама вирішує, що робити з повідомленням
        if (api.onMessage) { try { api.onMessage(ev, data); } catch (e) { console.warn(e); } return; }

        // зміни репетитора — одразу в сторінку уроку
        if (ev === 'ops' && data.ops && frame.contentWindow) {
          frame.contentWindow.postMessage({ mathhub: 'ops', ops: data.ops }, '*');
        }
        // репетитор перевидав урок (новий слайд, картинка) — беремо цілком
        if (ev === 'republished') load().catch(function () {});
      };
      ws.onclose = function () {
        open = false; joined = false; ws = null;
        if (beat) { clearInterval(beat); beat = null; }
        later();
      };
      ws.onerror = function () { try { ws && ws.close(); } catch (e) {} };
    }

    function later() {
      setTimeout(connect, wait);
      wait = Math.min(wait * 2, 30000);
    }

    function send(event, payload) {
      if (!joined) { queue.push([event, payload]); if (queue.length > 20) queue.shift(); return false; }
      return raw('broadcast', { type: 'broadcast', event: event, payload: payload || {} });
    }

    window.addEventListener('online', function () { if (!ws) { wait = 1000; connect(); } });

    var api = { connect: connect, send: send, alive: function () { return joined; }, onMessage: null };
    return api;
  })();

  /* Стежимо за змінами дешево: питаємо лише номер версії, а сам урок
     тягнемо тільки коли він справді оновився. */
  function watch() {
    setTimeout(function () {
      if (document.visibilityState === 'hidden') { watch(); return; }
      rpc('share_rev', { p_token: token })
        .then(function (res) {
          /* Збій запиту — це НЕ «доступ закрито». Раніше будь-яка невдала
             відповідь читалася як відкликання, і урок зникав з екрана
             через хвилинну втрату зв'язку. Тепер такі випадки просто
             чекають наступної спроби. */
          if (!res.ok) throw new Error('net');
          return res.json();
        })
        .then(function (rev) {
          if (rev == null) {
            /* Сервер відповів і сказав, що такого посилання немає. Але
               одну відповідь можна отримати й на порожньому місці, тому
               прибираємо урок лише після двох поспіль. */
            if (++gone < 2) return;
            frame.style.display = 'none';
            frame.srcdoc = '';
            msg.style.display = '';
            fail('Урок більше не доступний', 'Репетитор закрив доступ за цим посиланням.');
            throw new Error('stop');
          }
          gone = 0;
          if (rev !== shownRev) return load();
          return pullOps();
        })
        .then(function () { watch(); }, function (e) {
          // 'stop' — доступ закрито, більше не питаємо; решта — тимчасовий збій мережі
          if (!e || e.message !== 'stop') watch();
        });
    }, live.alive() ? WATCH_SLOW_MS : WATCH_MS);
  }

  /**
   * Забрати нові дії й віддати їх сторінці уроку.
   *
   * Помилку тут ковтаємо мовчки: журнал — це приємне доповнення, а не
   * умова роботи. Якщо він недоступний (стара база без цих функцій), урок
   * і далі оновлюється як раніше — цілком, коли зміниться версія.
   */
  function pullOps() {
    return rpc('share_ops_read', { p_token: token, p_after: opsAt })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (rows) {
        if (!rows || !rows.length) return;

        var ops = [];
        rows.forEach(function (r) {
          if (r.id > opsAt) opsAt = r.id;
          // свої ж дії назад не показуємо: вони вже на екрані
          if (r.author !== 'student') ops.push(r.op);
        });

        if (ops.length && frame.contentWindow) {
          frame.contentWindow.postMessage({ mathhub: 'ops', ops: ops }, '*');
        }
      })
      .catch(function () { /* журнал не обов'язковий */ });
  }

  /* Написане учнем приходить із самої сторінки уроку (вона в рамці),
     а відправляємо його звідси — рамка не знає ні адреси бази, ні ключа.

     Внески лежать в окремій таблиці й не заважають репетиторові зберігати
     свою базу: інакше його наступне збереження просто затерло б їх. */
  /* Черга написаного учнем.

     Досі вона жила в пам'яті вкладки. Тому кожен звичайний для уроку
     випадок — метро без мережі, закрита вкладка, перезавантажена сторінка —
     тихо забирав із собою розв'язання, і ні учень, ні репетитор про це не
     дізнавалися. Тепер черга лежить у пам'яті браузера й переживає все це,
     а стан видно написом угорі.

     Зі списку штрих зникає лише тоді, коли сервер підтвердив, що взяв його. */

  var INK_KEY = 'vektor.ink.' + token;
  var INK_MAX = 600;              // довша черга означає, що зв'язку немає давно
  var pending = readInk();
  var sending = false;
  var inkWait = 700;              // пауза до наступної спроби, росте при невдачах
  var inkTimer = null;
  var inkBox = document.getElementById('ink');

  function readInk() {
    try { return JSON.parse(localStorage.getItem(INK_KEY) || '[]') || []; }
    catch (e) { return []; }
  }

  function keepInk() {
    try {
      if (pending.length) localStorage.setItem(INK_KEY, JSON.stringify(pending.slice(-INK_MAX)));
      else localStorage.removeItem(INK_KEY);
    } catch (e) { /* сховище повне — черга принаймні лишається в пам'яті */ }
  }

  function setInk(state, text) {
    if (!inkBox) return;
    inkBox.className = 'ink is-on is-' + state;
    inkBox.textContent = text;
    if (state === 'ok') setTimeout(function () {
      if (!pending.length && inkBox.className.indexOf('is-ok') > 0) inkBox.className = 'ink';
    }, 2500);
  }

  function scheduleInk(ms) {
    if (inkTimer) clearTimeout(inkTimer);
    inkTimer = setTimeout(function () { inkTimer = null; flushInk(); }, ms);
  }

  function flushInk() {
    if (sending || !pending.length) return;
    if (!navigator.onLine) {
      setInk('wait', 'Немає звʼязку — збережено тут');
      scheduleInk(5000);
      return;
    }

    sending = true;
    setInk('send', 'Надсилаю написане…');
    var batch = pending.slice(0, 200);

    rpc('share_contribute', {
      p_token: token,
      p_kind: 'ink',
      p_payload: JSON.stringify(batch)
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      /* Викидаємо з черги лише після підтвердження сервера: доти штрихи
         лежать і в пам'яті браузера. */
      pending = pending.slice(batch.length);
      keepInk();
      inkWait = 700;
      // репетитор забере написане одразу, а не через кілька секунд
      live.send('ink', {});
      setInk(pending.length ? 'send' : 'ok', pending.length ? 'Надсилаю написане…' : 'Збережено');
    }).catch(function () {
      inkWait = Math.min(inkWait * 2, 15000);
      setInk('wait', 'Поки не надіслалось — спробую ще раз');
      scheduleInk(inkWait);
    }).then(function () {
      sending = false;
      if (pending.length && !inkTimer) scheduleInk(600);
    });
  }

  /* Написане, що не встигло поїхати минулого разу, віддаємо одразу. */
  if (pending.length) {
    setInk('wait', 'Надсилаю збережене з минулого разу…');
    scheduleInk(300);
  }

  window.addEventListener('online', function () { inkWait = 700; flushInk(); });

  /* Учень закриває вкладку з ненадісланим — остання спроба навздогін.
     keepalive дозволяє запиту пережити саму сторінку. */
  window.addEventListener('pagehide', function () {
    if (!pending.length || sending) return;
    try {
      fetch(API + '/rest/v1/rpc/share_contribute', {
        method: 'POST',
        keepalive: true,
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: token, p_kind: 'ink',
          p_payload: JSON.stringify(pending.slice(0, 200)) })
      });
    } catch (e) { /* не вийшло — черга лишилась у сховищі до наступного разу */ }
  });

  /* ---------- Фото розв'язань ----------

     Телефонне фото — це 3–5 МБ, і надсилати його як є нерозумно: учень чекав би
     хвилину на кожне. Тому зменшуємо до 1800 пікселів по довшій стороні
     й перекодовуємо — з кількох мегабайтів виходять десятки кілобайтів,
     а розв'язання лишається читабельним. Так само робить і сама програма. */
  var MAX_SIDE = 1800;

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('не картинка')); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) { URL.revokeObjectURL(url); reject(new Error('порожнє')); return; }
        var k = Math.min(1, MAX_SIDE / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * k));
        cv.height = Math.max(1, Math.round(h * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        var type = 'image/webp';
        cv.toBlob(function (blob) {
          if (!blob) { reject(new Error('не стиснулось')); return; }
          // якщо стиснення не допомогло — краще надіслати оригінал
          // розміри повертаємо теж: за ними картинка лягає на дошку в правильних пропорціях
          resolve({ blob: blob.size < file.size ? blob : file, w: w, h: h });
        }, type, 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('не прочиталось')); };
      img.src = url;
    });
  }

  function newKey() {
    return 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function uploadPhoto(blob) {
    var key = newKey();
    var path = '/storage/v1/object/uploads/' + encodeURIComponent(token) + '/' + key;
    return fetch(API + path, {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': blob.type || 'application/octet-stream' },
      body: blob
    }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      return { key: key, url: API + '/storage/v1/object/public/uploads/' + encodeURIComponent(token) + '/' + key };
    });
  }

  /** Стиснути й вивантажити пачку файлів. Повертає [{key,url,w,h}]. */
  function uploadAll(files) {
    var done = [];
    var chain = Promise.resolve();
    files.slice(0, 10).forEach(function (f) {          // більше десяти за раз не приймаємо
      chain = chain.then(function () {
        return shrink(f)
          .then(function (r) {
            return uploadPhoto(r.blob).then(function (up) {
              done.push({ key: up.key, url: up.url, w: r.w, h: r.h });
            });
          })
          .catch(function () { /* одне невдале фото не має валити решту */ });
      });
    });
    return chain.then(function () { return done; });
  }

  function sendHomework(hwId, files) {
    var done = [];
    var chain = uploadAll(files).then(function (r) { done = r; });
    return chain.then(function () {
      if (!done.length) throw new Error('нічого не завантажилось');
      return rpc('share_contribute', {
        p_token: token,
        p_kind: 'homework',
        p_payload: JSON.stringify({ hw: hwId, photos: done })
      }).then(function (res) {
        if (!res.ok) throw new Error('http ' + res.status);
        live.send('hw', {});
        return done.map(function (d) { return d.url; });
      });
    });
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;

    /* Дія, яку наживо не застосувати: з'явився цілий слайд або нова
       картинка, якої в цієї сторінки фізично немає. Тоді несемо урок
       цілком — там і стрічка перебудується, і файли приїдуть. */
    if (d.mathhub === 'need-full') {
      // просимо репетитора перевидати урок негайно, а поки беремо те, що вже є
      live.send('need', {});
      load().catch(function () {});
      return;
    }

    // сторінка уроку каже, де учень зараз дивиться — запам'ятовуємо для оновлення
    if (d.mathhub === 'view') {
      view = { idx: d.idx, scale: d.scale, cam: d.cam };
      return;
    }

    if (d.mathhub === 'ink' || d.mathhub === 'ink-undo') {
      pending.push(d);
      keepInk();
      // трохи чекаємо: за урок штрихів багато, і слати кожен окремо — марно
      scheduleInk(400);
      return;
    }

    if (d.mathhub === 'hw') {
      sendHomework(d.hw, [].slice.call(d.files || []))
        .then(function (urls) {
          frame.contentWindow.postMessage({ mathhub: 'hw-done', hw: d.hw, urls: urls }, '*');
        })
        .catch(function () {
          frame.contentWindow.postMessage({ mathhub: 'hw-done', hw: d.hw, error: true }, '*');
        });
      return;
    }

    /* Фото чи скріншот, вставлені учнем прямо на дошку. Вивантажуємо тут,
       бо сторінка уроку не знає ні адреси бази, ні ключа — і не повинна. */
    if (d.mathhub === 'pic') {
      uploadAll([].slice.call(d.files || []))
        .then(function (items) {
          if (!items.length) throw new Error('нічого не завантажилось');
          frame.contentWindow.postMessage({ mathhub: 'pic-done', items: items }, '*');
        })
        .catch(function () {
          frame.contentWindow.postMessage({ mathhub: 'pic-done', error: true }, '*');
        });
    }
  });

  /* ============================================================
     Жива дошка — той самий рушій, що в репетитора
     ============================================================

     Якщо в базі вже є функції живої дошки й знімок цієї дошки, сторінка
     вантажить справжній рушій і читає стан прямо з бази — без жодного
     перевидання. Інакше (база ще не оновлена, дошку ніколи не зберігали)
     урок відкривається по-старому, окремою копією. Учень різниці в
     посиланні не помічає. */

  var ENGINE = ['points', 'constructions', 'plot', 'solids', 'board', 'ops', 'student'];
  /* Номер версії рушія — його піднімає tools/bump.js разом із кабінетом.
     Без номера кожен файл брався окремо «мережа або кеш за 1,5 с», і на
     повільному інтернеті рушій складався з файлів різних версій. */
  var ENGINE_V = 153;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('не завантажився ' + src)); };
      document.head.appendChild(s);
    });
  }

  function loadEngine() {
    return ENGINE.reduce(function (chain, name) {
      return chain.then(function () { return loadScript('share/engine/' + name + '.js?v=' + ENGINE_V); });
    }, Promise.resolve());
  }

  /* Матеріали, домашнє й адреси картинок лежать у тому, що кабінет
     публікує для уроку. Старий формат — сторінка з даними всередині,
     новий — самі дані. Читаємо обидва. */
  function readMeta() {
    return rpc('share_read', { p_token: token })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (rows) {
        var raw = rows && rows[0] && rows[0].data;
        if (!raw) return null;
        if (raw.charAt(0) === '{') return JSON.parse(raw);
        var m = /var DATA = (\{[\s\S]*?\});\n/.exec(raw);
        return m ? JSON.parse(m[1]) : null;
      })
      .catch(function () { return null; });
  }

  function startLive(row) {
    return Promise.all([readMeta(), loadEngine()]).then(function (res) {
      msg.style.display = 'none';
      frame.style.display = 'none';
      var root = document.createElement('div');
      root.style.height = '100%';
      document.body.appendChild(root);
      var back = document.querySelector('.back-portal');
      if (back) document.body.appendChild(back);          // «до розкладу» лишається зверху

      return window.StudentBoard.start({
        token: token,
        uid: path.split('/')[0],
        API: API,
        KEY: KEY,
        rpc: rpc,
        live: live,
        row: row,
        meta: res[0],
        root: root,
        readMeta: readMeta,
        shrink: shrink,
        uploadPhoto: uploadPhoto,
        sendHomework: sendHomework
      });
    });
  }

  function startLegacy() {
    return load()
      .then(function () { live.connect(); watch(); })
      .catch(function (e) {
        if (e && e.message === 'revoked') {
          fail('Урок більше не доступний', 'Репетитор закрив доступ за цим посиланням.');
        } else if (e && e.message === 'setup') {
          fail('Урок ще не готовий', 'Зверніться до репетитора — він має завершити налаштування.');
        } else {
          fail('Не вдалося відкрити урок', 'Перевірте інтернет і спробуйте ще раз.');
        }
      });
  }

  rpc('share_board', { p_token: token })
    .then(function (res) { return res.ok ? res.json() : null; })
    .catch(function () { return null; })
    .then(function (rows) {
      var row = rows && rows[0];
      if (!row || !row.data) return startLegacy();
      return startLive(row).catch(function (e) {
        // жива дошка не піднялась — учень однаково має побачити урок
        console.warn('Жива дошка не запустилась:', e && e.message);
        return startLegacy();
      });
    });

  /* ============================================================
     Портал: розклад і матеріали
     ============================================================ */

  function startPortal(tok) {
    document.title = 'Мій розклад — Вектор';

    if (!/^[0-9a-f]{16,}$/i.test(tok)) {
      fail('Посилання неповне', 'Схоже, адресу скопійовано не до кінця. Попросіть надіслати її ще раз.');
      return;
    }

    var box = document.getElementById('portal');
    var PIN_KEY = 'vektor.pin.' + tok;
    var pin = '';
    try { pin = sessionStorage.getItem(PIN_KEY) || ''; } catch (e) {}
    var shown = -1;
    var portalGone = 0;   // скільки разів поспіль сервер сказав, що порталу немає

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var MON = ['січ', 'лют', 'бер', 'квіт', 'трав', 'черв',
               'лип', 'серп', 'вер', 'жовт', 'лист', 'груд'];

    function when(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return { day: '—', mon: '', time: '', ts: 0 };
      return {
        day: d.getDate(),
        mon: MON[d.getMonth()],
        time: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2),
        ts: d.getTime()
      };
    }

    /* Порталом користуються з телефона перед заняттям, тому найближче —
       зверху, а вже проведене — нижче й згорнуте. */
    function render(data) {
      var all = (data.lessons || []).map(function (l) {
        var w = when(l.date);
        return { l: l, w: w };
      }).sort(function (a, b) { return a.w.ts - b.w.ts; });

      /* Межа — початок сьогоднішнього дня, а не поточна година. Інакше
         заняття, що було вранці, після обіду переїжджало б у «пройдено»,
         хоч репетитор ще не позначив його проведеним. Заразом усе, що вже
         позначено (проведено, пропущено, скасовано), одразу йде вниз. */
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var dayStart = today.getTime();
      var OPEN = { planned: 1, moved: 1 };

      /* «Найближчі» — це найближчі. Розклад буває розписаний на місяці
         наперед, і показувати два десятки однакових рядків означає
         поховати серед них те єдине, що справді потрібне: коли наступне
         заняття. Решту згортаємо в один рядок. */
      var SHOW_NEXT = 5;
      var futureAll = all.filter(function (x) {
        return OPEN[x.l.status] && x.w.ts >= dayStart;
      });
      var future = futureAll.slice(0, SHOW_NEXT);
      var futureRest = futureAll.length - future.length;
      var past = all.filter(function (x) {
        return !(OPEN[x.l.status] && x.w.ts >= dayStart);
      }).reverse();

      function lesHtml(x) {
        var l = x.l;
        var tag = l.status === 'done' ? '<span class="tag tag--done">проведено</span>'
                : l.status === 'missed' ? '<span class="tag tag--miss">пропущено</span>'
                : '';
        /* Посилання є лише в уроків, дошку яких репетитор відкрив.
           Ведемо на ту саму сторінку уроку, що й окреме посилання. */
        var open = l.url
          ? '<a class="les__go" href="' + esc(l.url) + '">Відкрити урок</a>'
          : '';

        return '<div class="les">' +
          '<div class="les__d"><b>' + x.w.day + '</b><span>' + x.w.mon + '</span></div>' +
          '<div class="les__m">' +
            '<div class="les__t">' + esc(l.topic || 'Заняття') + tag + '</div>' +
            '<div class="les__s">' + x.w.time + ' · ' + (l.dur || 60) + ' хв' +
            (l.notes ? '\n' + esc(l.notes) : '') + '</div>' +
            open +
          '</div></div>';
      }

      var mats = data.materials || [];

      box.innerHTML =
        '<div class="phead"><div class="pw">' +
          '<h1>' + esc(data.student || 'Мій кабінет') + '</h1>' +
          '<div class="sub">' + esc([data.grade, data.goal].filter(Boolean).join(' · ')) + '</div>' +
        '</div></div>' +

        '<div class="pw" style="padding-top:24px">' +

          '<div class="pcard">' +
            '<h2>Найближчі заняття</h2>' +
            (future.length ? future.map(lesHtml).join('')
                           : '<div class="none">Наступних занять поки не заплановано.</div>') +
            (futureRest > 0
              ? '<div class="none">…і ще ' + futureRest + ' далі за розкладом</div>'
              : '') +
          '</div>' +

          (mats.length ? '<div class="pcard">' +
            '<h2>Матеріали</h2>' +
            mats.map(function (m) {
              var links = '';
              if (m.url) links += '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">Відкрити</a>';
              (m.files || []).forEach(function (f) {
                links += '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
                  esc(f.name) + '</a>';
              });
              /* Матеріал може бути без посилання й без файлів — тоді відкривати
                 нема чого. Раніше він мовчки виглядав як звичайний рядок, і
                 здавалося, що просто нічого не працює. */
              if (!links) links = '<div class="mat__soon">Репетитор ще не додав сюди файл</div>';
              return '<div class="mat"><div class="mat__t">' + esc(m.title) + '</div>' +
                (m.note ? '<div class="mat__n">' + esc(m.note) + '</div>' : '') +
                links + '</div>';
            }).join('') +
          '</div>' : '') +

          (past.length ? '<div class="pcard">' +
            '<h2>Уже пройдено</h2>' +
            '<div class="h-sub">' + past.length + ' — можна освіжити в памʼяті</div>' +
            past.slice(0, 40).map(lesHtml).join('') +
          '</div>' : '') +

          '<div class="foot">Вектор · сторінка оновлюється сама</div>' +
        '</div>';

      document.getElementById('msg').style.display = 'none';
      box.style.display = 'block';
      document.title = (data.student || 'Мій розклад') + ' — Вектор';
    }

    function read() {
      return rpc('portal_read', { p_token: tok, p_pin: pin })
        .then(function (res) {
          if (res.status === 404) throw new Error('setup');
          if (!res.ok) throw new Error('denied');
          return res.json();
        })
        .then(function (rows) {
          var row = rows && rows[0];
          if (!row || !row.data) throw new Error('empty');
          shown = row.rev;
          try { sessionStorage.setItem(PIN_KEY, pin); } catch (e) {}
          render(JSON.parse(row.data));
        });
    }

    /* Розклад міняється рідко, тому питаємо нечасто: щосекундне опитування
       тут не дало б нічого, крім витрати батареї. */
    function watchPortal() {
      setTimeout(function () {
        if (document.visibilityState === 'hidden') { watchPortal(); return; }
        rpc('portal_rev', { p_token: tok })
          .then(function (res) {
            // збій мережі — не привід прибирати сторінку з-під учня
            if (!res.ok) throw new Error('net');
            return res.json();
          })
          .then(function (rev) {
            if (rev == null) {
              // прибираємо лише після двох поспіль однакових відповідей
              if (++portalGone < 2) return;
              box.style.display = 'none';
              document.getElementById('msg').style.display = '';
              fail('Доступ закрито', 'Репетитор закрив цей портал.');
              throw new Error('stop');
            }
            portalGone = 0;
            if (rev !== shown) return read();
          })
          .then(function () { watchPortal(); }, function (e) {
            if (!e || e.message !== 'stop') watchPortal();
          });
      }, 30000);
    }

    function askPin(msg) {
      spin.style.display = 'none';
      h.textContent = 'Твій кабінет';
      p.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.className = 'pin';
      wrap.innerHTML =
        '<div style="font-size:13.5px;color:#3D3B63;line-height:1.6">Введи код, який дав репетитор.</div>' +
        '<input inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Код входу">' +
        '<button type="button">Увійти</button>' +
        '<div class="err">' + (msg || '') + '</div>';
      p.appendChild(wrap);

      var inp = wrap.querySelector('input');
      var btn = wrap.querySelector('button');
      var err = wrap.querySelector('.err');
      inp.focus();

      function go() {
        var v = inp.value.trim();
        if (!v) { err.textContent = 'Введи код.'; return; }
        btn.disabled = true;
        err.textContent = '';
        pin = v;
        read().then(function () { watchPortal(); }, function () {
          btn.disabled = false;
          pin = '';
          inp.value = '';
          inp.focus();
          err.textContent = 'Код не підходить. Спробуй ще раз.';
          // після десятої помилки портал закривається — кажемо про це одразу
          rpc('portal_gate', { p_token: tok })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (rows) {
              var g = rows && rows[0];
              if (g && g.locked) {
                fail('Вхід тимчасово закрито',
                     'Код вводили неправильно забагато разів. Попроси репетитора задати новий.');
              }
            }).catch(function () {});
        });
      }
      btn.onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    }

    h.textContent = 'Відкриваю кабінет…';
    p.textContent = 'Хвилинку.';

    rpc('portal_gate', { p_token: tok })
      .then(function (res) {
        if (res.status === 404) throw new Error('setup');
        if (!res.ok) throw new Error('net');
        return res.json();
      })
      .then(function (rows) {
        var g = rows && rows[0];
        if (!g) throw new Error('gone');
        if (g.locked) {
          fail('Вхід тимчасово закрито',
               'Код вводили неправильно забагато разів. Попроси репетитора задати новий.');
          return;
        }
        if (!g.needs_pin) return read().then(function () { watchPortal(); });
        // код уже вводили в цій вкладці — пробуємо мовчки
        if (pin) {
          return read().then(function () { watchPortal(); }, function () { askPin(''); });
        }
        askPin('');
      })
      .catch(function (e) {
        var m = e && e.message;
        if (m === 'gone') fail('Доступ закрито', 'Репетитор закрив цей портал.');
        else if (m === 'setup') fail('Кабінет ще не готовий', 'Зверніться до репетитора — він має завершити налаштування.');
        else fail('Не вдалося відкрити кабінет', 'Перевірте інтернет і спробуйте ще раз.');
      });
  }
})();
</script>
</body>
</html>
