# Netlify: збирати нічого не треба — це звичайні статичні файли.
# Правила кешування лежать окремо, у файлі _headers.

[build]
  publish = "."
  command = ""

# Програма — односторінкова, маршрути живуть у хеші (#/students),
# тому перенаправлення не потрібні. Але якщо хтось відкриє неіснуючий
# шлях, краще віддати сторінку, а не помилку.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
